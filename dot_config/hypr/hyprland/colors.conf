general {
    col.active_border = rgba(998f81AA)
    col.inactive_border = rgba(4d463aAA)
}

misc {
    background_color = rgba(16130fFF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(16130fFF)
        col.text = rgba(e9e1daFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e9e1da), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e9e1da), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(e9e1da), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(f4d395AA) rgba(f4d39577),pinned:1
