[package]
name = "kb-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
# Content-addressed filenames for images attached to `mach note --image`
# (see note::store_image) -- hex-encoded by hand to avoid a second crate.
sha2 = "0.10"
# float_roundtrip: without it, serde_json's float parser is a faster
# algorithm that is not guaranteed correctly-rounded for every input — a
# vanishingly rare 1-ULP miss that `mach kb export`/`import`'s full-fidelity
# round trip (every `stability` value included) can't tolerate.
serde_json = { version = "1", features = ["float_roundtrip"] }
# code_index::chunk -- tree-sitter grammars for the syntax-aware chunker.
# Pinned exact versions verified to build and parse correctly together:
# tree-sitter-c-sharp's generated parser targets ABI 15, which needs a
# tree-sitter core >= 0.25 (0.24.x tops out at ABI 14 and fails at runtime
# with LanguageError { version: 15 }, even though it compiles fine). All
# other grammars here are ABI 14 and parse fine under the 0.25 core too
# (core's MIN_COMPATIBLE_LANGUAGE_VERSION stayed at 13). See
# task-3-report.md for the compatibility matrix.
tree-sitter = "=0.25.10"
tree-sitter-c = "=0.23.4"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-rust = "=0.23.3"
tree-sitter-python = "=0.23.6"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.23.1"
tree-sitter-glsl = "=0.2.0"

[lib]
name = "kb"
path = "src/lib.rs"
