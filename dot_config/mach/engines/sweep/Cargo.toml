[package]
name = "sweep-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sweep"
path = "src/lib.rs"

[[bin]]
name = "sweep"
path = "src/bin/sweep.rs"

[[bin]]
name = "sweepd"
path = "src/bin/sweepd.rs"
