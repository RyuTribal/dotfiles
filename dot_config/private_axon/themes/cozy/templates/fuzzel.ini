{#- fuzzel's whole config: today's fuzzel.ini with the colours of its include, fuzzel_theme.ini,
    taken from the palette and the font from the manifest. ~/.config/fuzzel/fuzzel.ini links to
    this file, so without a generation fuzzel runs on its defaults. fuzzel only runs when the
    shell's launcher is dead. -#}
font={{ fonts.launcher.family }}
terminal=kitty -1
prompt=">>  "
layer=overlay

[colors]
background={{ colors.background.hex_stripped }}ff
text={{ colors.on_background.hex_stripped }}ff
selection={{ colors.surface_variant.hex_stripped }}ff
selection-text={{ colors.on_surface_variant.hex_stripped }}ff
border={{ colors.surface_variant.hex_stripped }}dd
match={{ colors.primary.hex_stripped }}ff
selection-match={{ colors.primary.hex_stripped }}ff

[border]
radius=17
width=1

[dmenu]
exit-immediately-if-empty=yes
