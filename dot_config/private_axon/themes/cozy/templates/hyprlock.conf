{#- The fallback lock layout, today's hyprlock.conf with the colours and fonts of
    hyprlock/colors.conf taken from the palette and the manifest; the clock follows
    axon.toml's [theme] lock_clock. hyprlock only runs when the shell's lock fails. -#}
background {
    color = rgba(181818FF)
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = {{ colors.outline | alpha(0.3333) | hypr }}
    inner_color = {{ colors.on_primary_fixed | alpha(0.0667) | hypr }}
    font_color = {{ colors.primary_fixed | hypr }}
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = {{ colors.primary_fixed | hypr }}
    font_size = 14
    font_family = {{ fonts.lock.family }}
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = {{ colors.primary_fixed | hypr }}
    font_size = 13
    font_family = {{ fonts.lock.family }}
    position = 0, -25
    halign = center
    valign = center
}


label { # Clock
    monitor =
    text = {{ lock.clock }}
    color = {{ colors.primary_fixed | hypr }}
    font_size = 65
    font_family = {{ fonts.lock_clock.family }} {{ fonts.lock_clock.style }}

    position = 0, 300
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = {{ colors.primary_fixed | hypr }}
    font_size = 17
    font_family = {{ fonts.lock_clock.family }} {{ fonts.lock_clock.style }}

    position = 0, 240
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = {{ colors.primary_fixed | hypr }}
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    font_family = {{ fonts.lock.family }}
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = {{ colors.primary_fixed | hypr }}
    font_size = 14
    font_family = {{ fonts.lock.family }}

    position = 30, -30
    halign = left
    valign = top
}
