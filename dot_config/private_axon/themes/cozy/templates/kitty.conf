{#- kitty's look: the font, the 16 ANSI colours and the colours kitty takes besides them,
    all from the terminal palette, and the tab, border and extended colours the Tokyo Night
    theme gave until now. kitty.conf includes this file last. -#}
# Font
font_family      {{ fonts.terminal.family }}
font_size {{ fonts.terminal.size | float }}

# Terminal palette
color0 {{ ansi[0].hex }}
color1 {{ ansi[1].hex }}
color2 {{ ansi[2].hex }}
color3 {{ ansi[3].hex }}
color4 {{ ansi[4].hex }}
color5 {{ ansi[5].hex }}
color6 {{ ansi[6].hex }}
color7 {{ ansi[7].hex }}
color8 {{ ansi[8].hex }}
color9 {{ ansi[9].hex }}
color10 {{ ansi[10].hex }}
color11 {{ ansi[11].hex }}
color12 {{ ansi[12].hex }}
color13 {{ ansi[13].hex }}
color14 {{ ansi[14].hex }}
color15 {{ ansi[15].hex }}
foreground {{ term.fg.hex }}
background {{ term.bg.hex }}
cursor {{ term.cursor.hex }}
cursor_text_color {{ term.cursor_text.hex }}
selection_foreground {{ term.selection_fg.hex }}
selection_background {{ term.selection_bg.hex }}

# Kept from the Tokyo Night theme
url_color #73daca

# Tabs
active_tab_background #7aa2f7
active_tab_foreground #16161e
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
#tab_bar_background #15161e

# Windows
active_border_color #7aa2f7
inactive_border_color #292e42

# extended colors
color16 #ff9e64
color17 #db4b4b
