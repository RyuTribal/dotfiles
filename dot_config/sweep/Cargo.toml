[package]
name = "sweep"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sweep"
path = "src/engine.rs"

[[bin]]
name = "sweep"
path = "src/main.rs"

[[bin]]
name = "sweepd"
path = "src/bin/sweepd.rs"

[profile.release]
lto = true
strip = true
